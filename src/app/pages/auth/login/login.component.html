<div class="login-wrapper">
  <div class="login-container">
    <h1>Login</h1>
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="field-group">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Username</mat-label>
          <input
            matInput
            type="text"
            placeholder="Inserisci il tuo username"
            [(ngModel)]="username"
            name="username"
            required
            #usernameInput="ngModel"
          />
          <mat-icon matPrefix>person</mat-icon>
          <mat-error *ngIf="usernameInput.invalid && usernameInput.touched">
            Username obbligatorio
          </mat-error>
        </mat-form-field>
      </div>

      <div class="field-group">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input
            matInput
            [type]="hidePassword ? 'password' : 'text'"
            placeholder="Inserisci la tua password"
            [(ngModel)]="password"
            name="password"
            required
            #passwordInput="ngModel"
          />
          <mat-icon matPrefix>lock</mat-icon>
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="'Mostra/nascondi password'"
          >
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="passwordInput.invalid && passwordInput.touched">
            Password obbligatoria
          </mat-error>
        </mat-form-field>
      </div>

      <div class="button-group">
        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="loginForm.invalid || isLoading"
          class="login-button"
        >
          <mat-icon>check</mat-icon>
          <span *ngIf="!isLoading">Accedi</span>
          <span *ngIf="isLoading">Caricamento...</span>
        </button>
      </div>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>
    </form>
  </div>
</div>
